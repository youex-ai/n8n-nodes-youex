name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # The `scan` job below only runs on a manual dispatch — see its comment.
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for both jobs: neither writes anything back to the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Pinned rather than `lts/*`: the floating alias moves under us, and n8n's
          # supported range is what has to be tracked here, not npm's newest LTS.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      # `n8n-node lint` is a superset of the scanner on general JS/TS rules and a
      # SUBSET on the community ones: it pins @n8n/eslint-plugin-community-nodes
      # 0.28.0 where the scanner pins 0.29.0. Both run, for that reason.
      - name: Run lint
        run: 'npm run lint'

      # The scanner's lint leg, on the exact ruleset verification uses. Installed
      # into a temp prefix rather than added to devDependencies: it would drag
      # eslint, typescript and axios into the dev tree for one step.
      - name: Verification lint (scanner ruleset)
        run: |
          npm install --silent --prefix "$RUNNER_TEMP/scan" --no-save @n8n/scan-community-package@0.32.0
          node scripts/scan-source.mjs "$RUNNER_TEMP/scan/node_modules/@n8n/scan-community-package/scanner/scanner.mjs"

      - name: Run build
        run: 'npm run build'

      # After the build on purpose: the suite imports the *compiled* signature
      # verifier, so what is tested is what ships. `node --test` only, no dev
      # dependency added.
      #
      # `npm run verify:registration` is deliberately not here: it drives n8n's
      # own loader and therefore needs an `n8n-core` on disk, which locally comes
      # from the npx cache `npm run dev` populates. Installing an unpinned one per
      # CI run buys little for its weight. It stays a local gate.
      - name: Run tests
        run: 'npm test'

  # PHASE 6 GATE — deliberately manual, and expected to fail until the package is
  # published.
  #
  # `@n8n/scan-community-package` accepts only a *published* package name: it
  # resolves the package from the npm registry and checks its provenance
  # attestation before linting anything. There is no local-directory mode, so this
  # cannot gate a pre-publication commit.
  #
  # The scan runs through scripts/scan-published.mjs rather than the scanner's own
  # CLI, which exits 0 even when the scan fails and prints ✅ progress lines before
  # a ❌ verdict. The script is the thing that turns the verdict into an exit code.
  scan:
    name: Verification scan (published package)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Scan published package
        run: 'npm run scan:published'
